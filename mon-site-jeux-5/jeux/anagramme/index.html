<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagramme du jour — FR / EN / ES</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../game-common.css">
<link rel="stylesheet" href="anagramme.css">
</head>
<body>

<div class="layout">
  <aside class="ad-slot quote-slot ad-left" aria-label="Citation du jour">
    <p class="quote-mark">"</p>
    <p class="quote-label">Citation du jour</p>
    <p id="quote-left-text" class="quote-text">Chargement...</p>
    <p id="quote-left-author" class="quote-author"></p>
  </aside>

  <main class="page">
    <a class="back-link" href="../../index.html">← Retour à l'accueil</a>

    <header class="game-header">
      <p class="eyebrow">🔤 Trois langues, trois mots</p>
      <h1>Anagramme du jour</h1>
      <p class="tagline" id="day-label">Grille du jour</p>
      <p class="instructions">Remets les lettres dans l'ordre pour retrouver le mot du jour, dans chacune des trois langues.</p>
    </header>

    <div class="lang-tabs">
      <button class="lang-tab lang-tab--active" data-lang="fr">🇫🇷 Français</button>
      <button class="lang-tab" data-lang="en">🇬🇧 English</button>
      <button class="lang-tab" data-lang="es">🇪🇸 Español</button>
    </div>

    <div id="panel-fr" class="lang-panel"></div>
    <div id="panel-en" class="lang-panel" style="display:none;"></div>
    <div id="panel-es" class="lang-panel" style="display:none;"></div>
  </main>

  <aside class="ad-slot quote-slot ad-right" aria-label="Proverbe du jour">
    <p class="quote-mark">"</p>
    <p class="quote-label">Proverbe du jour</p>
    <p id="quote-right-text" class="quote-text">Chargement...</p>
    <p id="quote-right-author" class="quote-author"></p>
  </aside>
</div>

<script src="../../shared.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
<script src="../../quotes.js"></script>
</body>
</html>
